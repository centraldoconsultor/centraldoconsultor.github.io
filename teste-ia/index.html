<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste da IA · Central do Consultor</title>
<script src="../central/central-db.js?v=5"></script>
<style>
:root{--navy:#0e2a52;--gold:#b08a3e;--bg:#efeae2;--eu:#d9fdd3;--cli:#fff;--fg:#111b21;--muted:#667781}
@media (prefers-color-scheme:dark){:root{--bg:#0b141a;--eu:#005c4b;--cli:#202c33;--fg:#e9edef;--muted:#8696a0}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{background:var(--navy);color:#f4efe3;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:1rem}header small{opacity:.8}
header input{margin-left:auto;padding:6px 8px;border-radius:8px;border:0;width:170px}
header button{padding:6px 10px;border-radius:8px;border:0;background:#d9bf85;color:#0e1f3d;font-weight:700;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;max-width:760px;width:100%;margin:0 auto}
.m{max-width:80%;padding:7px 10px;border-radius:8px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px .5px rgba(0,0,0,.13)}
.lead{align-self:flex-end;background:var(--eu)}.ia{align-self:flex-start;background:var(--cli)}
.aviso{align-self:center;background:#fff3c4;color:#5b4500;font-size:.85rem;border-radius:8px;padding:6px 10px;max-width:90%}
.m a{color:inherit}
form{display:flex;gap:8px;padding:10px;max-width:760px;width:100%;margin:0 auto}
form textarea{flex:1;resize:none;border-radius:20px;border:0;padding:10px 14px;font:inherit;height:44px}
form button{border:0;border-radius:50%;width:44px;height:44px;background:#00a884;color:#fff;font-size:18px;cursor:pointer}
#st{font-size:.8rem;color:var(--muted);text-align:center;min-height:1.2em}
</style>
</head>
<body>
<header><a href="../caixa/" style="color:#d9bf85;text-decoration:none;font-weight:700">‹ Caixa</a><b>Teste da IA</b><small>Você escreve como se fosse o cliente. Nada é enviado no WhatsApp.</small>
<label style="font-size:.85rem;display:flex;gap:4px;align-items:center;margin-left:auto"><input type="checkbox" id="real" checked style="width:auto">Tempo real</label><input id="nome" placeholder="Nome do cliente (perfil)" style="margin-left:0"><button id="limpar" type="button">Nova conversa</button></header>
<div id="chat"><div class="aviso">Escreva a primeira mensagem do cliente, por exemplo: "Oi, quero cotação de plano de saúde".</div></div>
<div id="st"></div>
<div id="uso" style="font-size:.75rem;color:var(--muted);text-align:center;min-height:1em"></div>
<form id="f"><textarea id="txt" placeholder="Mensagem do cliente…"></textarea><button aria-label="Enviar">➤</button></form>
<script>
(function(){
  var conversa=[], chat=document.getElementById("chat"), st=document.getElementById("st");
  function add(cls,txt){ var d=document.createElement("div"); d.className="m "+cls; var safe=String(txt).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); d.innerHTML=safe.replace(/(https:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); chat.appendChild(d); chat.scrollTop=chat.scrollHeight; }
  function aviso(t){ var d=document.createElement("div"); d.className="aviso"; d.textContent=t; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; }
  document.getElementById("limpar").onclick=function(){ conversa=[]; chat.innerHTML=""; aviso("Nova conversa."); };
  document.getElementById("txt").addEventListener("keydown",function(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); document.getElementById("f").requestSubmit(); } });
  var timer=null, tick=null, primeiraPendente=0, ultimaMsg=0, ocupado=false;
  function esperar(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function jaRespondeu(){ return conversa.some(function(m){ return m.de==="ia"; }); }
  function agendar(){
    var real=document.getElementById("real").checked;
    clearTimeout(timer); clearInterval(tick);
    if(!real){ timer=setTimeout(responder,300); return; }
    // igual ao WhatsApp: junta mensagens por 35s; 1a resposta ~2 min, depois 1 a 1,5 min
    var alvo=jaRespondeu()? (60000+Math.random()*30000) : 115000;
    var quando=Math.max(primeiraPendente+alvo, ultimaMsg+35000);
    tick=setInterval(function(){ var f=Math.max(0,Math.round((quando-Date.now())/1000)); st.textContent="IA responde em "+Math.floor(f/60)+":"+String(f%60).padStart(2,"0")+" (como no WhatsApp)"; },500);
    timer=setTimeout(responder, quando-Date.now());
  }
  async function responder(){
    clearInterval(tick); if(ocupado){ timer=setTimeout(responder,1000); return; }
    ocupado=true; primeiraPendente=0; st.textContent="digitando…";
    var real=document.getElementById("real").checked;
    try{
      var r=await window.CentralAuth.funcao("whatsapp-webhook?simular=1",{conversa:conversa.slice(),nome:document.getElementById("nome").value.trim()||null});
      if(r.error){ st.textContent=""; var msg=""; try{ var j=await r.error.context.json(); msg=(j&&j.erro)||""; }catch(_){} aviso(msg||("Erro: "+(r.error.message||r.error)+" — entre na Central primeiro e tente de novo.")); return; }
      var s=r.data||{};
      if(s.erro){ st.textContent=""; aviso("Erro: "+s.erro); return; }
      var ls=s.linhas||[];
      for(var i=0;i<ls.length;i++){
        if(i>0&&real){ st.textContent="digitando…"; await esperar(2500+Math.random()*2000); }
        add("ia",ls[i]); conversa.push({de:"ia",texto:ls[i]});
      }
      st.textContent=""; mostrarUso();
      if(s.passar_para_diego) aviso("➜ Passou para você"+(s.motivo?": "+s.motivo:""));
      if(s.resumo) aviso("Resumo: "+[s.resumo.nome,s.resumo.vidas?s.resumo.vidas+" vida(s)":"",(s.resumo.idades||[]).join(", "),s.resumo.cidade,s.resumo.observacoes,s.resumo.status].filter(Boolean).join(" · "));
    }catch(err){ st.textContent=""; aviso("Sem conexão: "+err.message); }
    finally{ ocupado=false; if(primeiraPendente) agendar(); }
  }
  document.getElementById("limpar").addEventListener("click",function(){ clearTimeout(timer); clearInterval(tick); primeiraPendente=0; st.textContent=""; });
  document.getElementById("f").addEventListener("submit",function(e){
    e.preventDefault(); var t=document.getElementById("txt").value.trim(); if(!t) return;
    document.getElementById("txt").value=""; add("lead",t); conversa.push({de:"lead",texto:t});
    var agora=Date.now(); if(!primeiraPendente) primeiraPendente=agora; ultimaMsg=agora;
    if(!ocupado) agendar();
  });
  // uso da IA no mes (cada consultor ve o seu)
  async function mostrarUso(){
    try{
      var s=await window.CentralAuth.sessao(); if(!s) return;
      var eu=s.user&&s.user.id; var r=await window.CentralAuth.rpc("uso_ia_resumo",{});
      var n=0, usd=0; (r.data||[]).forEach(function(x){ if(x.consultor_id===eu){ n+=Number(x.chamadas)||0; usd+=Number(x.custo_usd)||0; } });
      document.getElementById("uso").textContent= n? ("Seu uso da IA neste mês (teste + WhatsApp): "+n+" resposta"+(n>1?"s":"")+" · US$ "+usd.toFixed(2).replace(".",",")) : "";
    }catch(_){}
  }
  mostrarUso();
  window.CentralAuth && window.CentralAuth.sessao && window.CentralAuth.sessao().then(function(s){ if(!s) aviso("Você não está logado neste endereço: abra a Central (centralconsultorsaude.com.br/central/), entre com seu e-mail e senha e volte para esta página."); });
})();
</script>
</body>
</html>
