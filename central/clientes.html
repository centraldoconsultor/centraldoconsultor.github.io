</div>

    return '<article class="card'+cls+'"><div class="top"><div style="min-width:0"><div class="nm"><button class="nmb" type="button" data-prop="'+esc(p._id)+'">'+(p.codigo?'<span class="cod">Nº '+String(p.codigo).padStart(2,"0")+'</span>':'')+esc(p.cliente||"Sem nome")+'</button></div>'+
      '<div class="meta"><span class="chip d7">'+esc(mesNome(m))+'</span><span class="chip '+(od?"o":"d2")+'">'+(od?"Odonto":"Saúde")+'</span><span>'+v+' vida'+(v===1?"":"s")+'</span><span class="chip '+(perd?"w":(p.etapa==="implantada"?"o":"p"))+'">'+esc(ETAPA[p.etapa]||p.etapa||"")+'</span>'+(p.cancelado?'<span class="chip w">Cancelado no sistema da administradora</span>':'')+'</div></div></div>'+
      '<div class="grid">'+f("Mês da venda",mesNome(m))+f("Administradora · operadora",p.administradora)+f("Plano",p.produto)+f("Mensalidade",Number(p.mensalidade)>0?brl(p.mensalidade):"")+f("Premiação",pr)+f("Vigência",p.vigencia?br(p.vigencia):"")+f("Telefone",p.telefone,true)+f("Contrato / protocolo",p.protocolo,true)+f("Documento",p.documento,true)+'</div>'+((p.beneficiarios||[]).length?'<div class="plan"><b>Beneficiários:</b> '+p.beneficiarios.map(function(b){return esc(b.nome||"sem nome")+' <span class="note">('+esc(b.parentesco||"")+(b.idade!=null?", "+esc(b.idade)+" anos":"")+(b.cpf?" · CPF "+esc(b.cpf):"")+(b.nascimento?" · nasc. "+br(b.nascimento):"")+')</span>'}).join(" · ")+'</div>':'')+(/^https?:\/\//.test(p.drive||"")?'<div class="actions"><a class="btn" href="'+esc(p.drive)+'" target="_blank" rel="noopener">Abrir pasta no Drive ↗</a></div>':'')+'</article>';
  }
  function render(){
    if(!S.loaded) return;
    var Y=(window.CMES?CMES.get():today).slice(0,4);
    var q=norm($("q").value.trim());
    var doAno=S.p.filter(function(p){return p.etapa!=="rascunho"&&mesDe(p).slice(0,4)===Y});
    var cli=doAno.filter(function(p){return p.etapa!=="recusada"});
    var imp=cli.filter(function(p){return p.etapa==="implantada"}).length, perdN=doAno.length-cli.length;
    var vs=0,vo=0,ns=0,no=0,mens=0,pr=0,nm=0,np=0;
    cli.forEach(function(p){ var v=Number(p.vidas)||0; if(isOd(p)){vo+=v;no++}else{vs+=v;ns++} if(Number(p.mensalidade)>0){mens+=+p.mensalidade;nm++} if(p.premiacao!=null&&p.premiacao!==""&&!isNaN(+p.premiacao)){pr+=+p.premiacao;np++} });
    $("k1").textContent=cli.length; $("k1s").textContent=ns+" saúde · "+no+" odonto · "+imp+" implantada"+(imp===1?"":"s")+(perdN?" · "+perdN+" perdido"+(perdN>1?"s":"")+" fora da conta":"");
    $("k2").textContent=vs+vo; $("k2s").textContent=vs+" saúde · "+vo+" odonto";
    $("k3").textContent=brl(mens); $("k3s").textContent=nm+" de "+cli.length+" com mensalidade informada";
    $("k4").textContent=brl(pr); $("k4s").textContent=np+" de "+cli.length+" com premiação";
    var list=q?S.p.filter(function(p){return p.etapa!=="rascunho"}):doAno.slice();
    if(q) list=list.filter(function(p){ return norm([p.cliente,p.documento,p.telefone,p.administradora,p.produto,p.email,p.protocolo,(p.codigo?"n"+String(p.codigo).padStart(2,"0")+" "+String(p.codigo).padStart(2,"0"):"")].join(" ")).indexOf(q)>=0 || (q.replace(/\D/g,"").length>=3 && String(p.documento||"").replace(/\D/g,"").indexOf(q.replace(/\D/g,""))>=0); });
    list.sort(function(a,b){ return mesDe(b).localeCompare(mesDe(a))||((a.etapa==="recusada")-(b.etapa==="recusada"))||String(a.cliente).localeCompare(String(b.cliente),"pt-BR"); });
    $("tot").textContent=q?list.length+" encontrado"+(list.length===1?"":"s")+" em todos os anos":"";
    if(!list.length){ $("list").innerHTML='<div class="empty">'+(q?"Nenhum cliente encontrado.":"Nenhuma venda em "+Y+".")+'</div>'; $("cart").innerHTML=""; return; }
    var h="", cur=null;
    list.forEach(function(p){ var m=mesDe(p); if(m!==cur){ cur=m; var g=list.filter(function(x){return mesDe(x)===m&&x.etapa!=="recusada"}), gs=0,go=0; g.forEach(function(x){ if(isOd(x)) go+=Number(x.vidas)||0; else gs+=Number(x.vidas)||0; }); h+='<h2 class="ch">'+esc(mesNome(m))+' <small>'+g.length+' venda'+(g.length===1?"":"s")+' · '+gs+' vidas saúde · '+go+' odonto</small></h2>'; } h+=card(p); });
    $("list").innerHTML=h; $("cart").innerHTML="";
  }
  function cartCard(c){
    var od=/odonto/i.test((c.operadora||"")+" "+(c.plano||""));
    return '<article class="card'+(c.situacao==="A conferir"?" late":" done")+'"><div class="top"><div style="min-width:0"><div class="nm">'+esc(c.nome)+'</div><div class="meta"><span class="chip d2">'+esc(c.tipo||"")+'</span><span class="chip '+(od?"o":"d7")+'">'+(od?"Odonto":"Saúde")+'</span><span>'+(c.vidas||0)+' vida'+(c.vidas==1?"":"s")+'</span><span class="chip '+(c.situacao==="A conferir"?"w":"o")+'">'+esc(c.situacao||"Ativo")+'</span></div></div></div>'+
      '<div class="grid">'+f("Contrato",c.numero,true)+f("Administradora · operadora",[c.administradora,c.operadora].filter(Boolean).join(" · "))+f("Plano",c.plano)+f("Mensalidade",Number(c.mensalidade)>0?brl(c.mensalidade):"")+f("Vigência",c.vigencia?br(c.vigencia):"")+'</div></article>';
  }
  $("q").addEventListener("input",render);
  window.addEventListener("message",function(e){ if(e.origin!==location.origin) return; var d=e.data||{}; if(d.type==="central:busca"&&d.q){ $("q").value=d.q; render(); window.scrollTo(0,0); } });
  $("list").addEventListener("click",function(e){ var pb=e.target.closest("[data-prop]"); if(pb){ try{parent.postMessage({type:"central:proposta",id:pb.getAttribute("data-prop")},location.origin)}catch(er){} return; } var g=e.target.closest("[data-go]"); if(g){ try{parent.postMessage({type:"central:go",tab:g.getAttribute("data-go")},location.origin)}catch(er){} } });
  if(window.CMES) CMES.on(function(){ render(); });
  var timer=setTimeout(function(){ if(!S.loaded) $("list").innerHTML='<div class="empty">Não consegui carregar agora. Abra de novo em instantes.</div>'; },10000);
  var cl=(window.__C||(window.__C||window.claude)); if(!cl||!cl.use) return;
  cl.use("db").then(function(db){
    if(!db){ clearTimeout(timer); $("list").innerHTML='<div class="empty">Entre na Central com seu e-mail e senha para ver os clientes.</div>'; return; }
    db.collection("propostas").onSnapshot(function(s){ S.loaded=true; clearTimeout(timer); S.p=s.docs.map(function(d){var o=Object.assign({},d.data());o._id=d.id;return o}); render(); },function(){ clearTimeout(timer); $("list").innerHTML='<div class="empty">Não consegui ler os clientes.</div>'; });
    db.collection("carteira").onSnapshot(function(s){ S.cart=s.docs.map(function(d){var o=Object.assign({},d.data());o._id=d.id;return o}); render(); },function(){});
    db.collection("posvenda").onSnapshot(function(s){ var m={},ind={}; s.docs.forEach(function(d){ var o=Object.assign({},d.data()); m[d.id]=o; ind[d.id]=(o.indicacoes||[]).length; }); S.pv=m; S.ind=ind; render(); },function(){});
  });
})();
</script>
