<style>
/* Layout: navy masthead band, then a two-column workbench (form rail + results); client view is a single-column proposal sheet. */
:root{
  --navy:#0F1F3A; --navy-2:#1B2E52; --navy-3:#2A416B;
  --paper:#F8F5EE; --card:#FFFDF8; --sand:#F1EBDD;
  --gold:#B08A3E; --gold-2:#D9BF85; --gold-ink:#7A5A1C;
  --ink:#16223A; --muted:#5D6678; --line:#E4DCCB;
  --ok:#2F6B4F; --ok-bg:#E6F0EA; --warn:#9A4B21; --warn-bg:#F6E9DF;
  --f-display:"Cormorant Garamond", "Times New Roman", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.005em;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Masthead */
.mast{background:var(--navy);color:var(--paper);border-bottom:3px solid var(--gold)}
.mast .wrap{padding-block:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border:1.5px solid var(--gold-2);border-radius:50%;display:grid;place-items:center;color:var(--gold-2);font-family:var(--f-display);font-size:20px;font-weight:700}
.tabs{display:flex;gap:4px;background:var(--navy-2);border-radius:10px;padding:4px}
.tab{color:#C9D1E0;text-decoration:none;font-weight:600;font-size:14px;padding:7px 14px;border-radius:7px;display:inline-flex;align-items:center;gap:6px}
.tab[aria-current="page"]{background:var(--paper);color:var(--navy)}
.tab .cnt{background:var(--gold);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.resumo{display:flex;flex-direction:column;gap:10px}
.rs-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rs-head b{display:block;font-size:16px}
.rs-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rs-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rs-list small{display:block;color:var(--muted);font-size:12px}
.rs-list .oplogo{height:26px;max-width:90px}
.rs-list small.rs-promo{color:var(--gold-ink);font-weight:700}
.rs-v{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--navy);white-space:nowrap}
.hist{padding-block:28px 60px}
.hlist{display:flex;flex-direction:column;gap:10px}
.hrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center}
.h-date{font-size:12px;color:var(--gold-ink);font-weight:700;letter-spacing:.04em}
.h-cli{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.2}
.h-ops{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.h-ops .oplogo{height:22px;max-width:80px}
.h-val{text-align:right}
.h-val b{display:block;font-family:var(--f-display);font-size:24px;color:var(--navy)}
.h-act{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;border-top:1px dotted var(--line);padding-top:10px}
.h-act .btn{padding:7px 12px;font-size:13px}
.btn.del{color:var(--warn)}
.btn.del[data-armed]{background:var(--warn);border-color:var(--warn);color:#fff}
@media (max-width:640px){.tabs{order:3;width:100%}.tab{flex:1;justify-content:center}}
.mark-img{width:40px;height:auto;display:block}
.prop-mast-in{display:flex;align-items:center;justify-content:space-between;gap:24px}
.prop-mast-txt{min-width:0}
.prop-logo{width:120px;height:auto;flex:none}
.prop-side{display:flex;align-items:center;gap:28px;flex:none}
.prop-foto{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.prop-foto img{width:170px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:2px solid var(--gold-2);box-shadow:0 10px 26px rgba(0,0,0,.35);display:block}
.prop-foto figcaption{text-align:center;line-height:1.25}
.prop-foto b{display:block;color:var(--paper);font-size:15px}
.prop-foto span{color:var(--gold-2);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.prop-foto em{display:block;font-style:normal;color:var(--gold-2);font-weight:700;font-size:14px;margin-top:3px;letter-spacing:.04em;user-select:all}
.prop-foto b{text-transform:uppercase;letter-spacing:.06em}
@media (max-width:640px){.prop-mast-in{flex-direction:row;align-items:flex-start;gap:14px}.prop-mast-txt{flex:1}.prop-mast .wrap{padding-block:24px 22px}.prop-mast h1{font-size:26px}.prop-mast .eyebrow{font-size:13px}.prop-meta{gap:8px 18px}.prop-side{gap:0}.prop-foto{gap:6px}.prop-foto img{width:160px}.prop-foto b{font-size:15px}.prop-foto span{font-size:10px}}
.brand h1{font-size:26px;color:var(--paper);line-height:1}
.brand small{display:block;color:var(--gold-2);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.mast-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold:hover{background:var(--gold-ink);border-color:var(--gold-ink)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.btn.ghost-dark{background:transparent;border-color:var(--navy-3);color:var(--paper)}
.btn.ghost-dark:hover{border-color:var(--gold-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Workbench */
.bench{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;padding-block:28px 120px;align-items:start}
.rail{position:sticky;top:16px;max-height:calc(100vh - 120px);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.step{display:flex;flex-direction:column;gap:8px}
.step + .step{border-top:1px solid var(--line);padding-top:16px}
.step-h{display:flex;align-items:baseline;gap:8px}
.step-h b{font-family:var(--f-display);font-size:20px;color:var(--gold);font-weight:700;line-height:1}
.step-h span{font-weight:700;font-size:14px}
label.lbl{font-size:12px;color:var(--muted);font-weight:600}
.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px}
.field:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(176,138,62,.15)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));background:var(--sand);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:8px 6px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--paper)}
.ages{display:flex;flex-wrap:wrap;gap:6px}
.age{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:var(--paper);border-radius:999px;padding:4px 6px 4px 11px;font-size:13px;font-weight:600}
.age button{border:0;background:var(--navy-3);color:var(--paper);width:20px;height:20px;border-radius:50%;cursor:pointer;line-height:1;font-size:13px}
.addrow{display:flex;gap:6px}
.fx{display:flex;flex-direction:column;gap:6px}
.fxrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 6px 6px 12px;font-weight:600;font-size:14px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--sand);cursor:pointer;font-weight:700;font-size:16px;line-height:1}
.stepper button:hover{border-color:var(--gold)}
.stepper input{width:46px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:5px 4px;font-weight:700}
.addrow .field{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--paper)}
.hint{font-size:12px;color:var(--muted);margin:0}
.notice{margin-top:8px;background:#FBF5E6;border:1px solid var(--gold-2);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.notice p{margin:0;font-size:13px;color:var(--ink);flex:1 1 320px}
.notice .btn{padding:7px 12px;font-size:13px}
.opchips{display:flex;flex-direction:column;gap:6px}
.opchip{display:flex;align-items:center;gap:10px;border:1px solid var(--navy);background:#F3F5F9;border-radius:10px;padding:7px 8px 7px 10px}
.opchip>span{flex:1;min-width:0}
.oplogo.mono{display:inline-flex;align-items:center;justify-content:center;width:30px;min-width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold-2,#D9B65C);font-weight:700;font-size:12px;letter-spacing:.02em;padding:0}
.canal{font-size:.82em;font-weight:500;color:var(--muted)}
.opchip b{display:block;font-size:13px;line-height:1.2}
.opchip small{font-size:11px;color:var(--muted)}
.opchip .oplogo{height:24px;max-width:70px}
.opchip button{border:0;background:var(--navy);color:var(--paper);width:24px;height:24px;border-radius:50%;cursor:pointer;flex:none}
.opgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opbtn{display:flex;gap:9px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;cursor:pointer}
.opbtn b{display:block;font-size:13px;line-height:1.2}
.opbtn small{font-size:11px;color:var(--muted)}
.opbtn .box{flex:none;width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px;margin-top:1px;display:grid;place-items:center;background:#fff}
.opbtn[aria-pressed="true"]{border-color:var(--navy);background:#F3F5F9}
.opbtn[aria-pressed="true"] .box{background:var(--navy);border-color:var(--navy)}
.opbtn[aria-pressed="true"] .box::after{content:"";width:9px;height:5px;border-left:2px solid var(--gold-2);border-bottom:2px solid var(--gold-2);transform:rotate(-45deg) translate(1px,-1px)}
.opbtn:disabled{opacity:.45;cursor:not-allowed}

/* Results */
.res-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.res-head h2{font-size:30px}
.res-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sort{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:start}
.plan.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pick{margin-top:4px;width:20px;height:20px;accent-color:var(--navy);cursor:pointer}
.plan-main{min-width:0}
.opline{display:inline-flex;align-items:center;gap:10px}
.oplogo{height:30px;width:auto;max-width:120px;object-fit:contain;border-radius:5px;flex:none}
.pcard .oplogo{height:36px;max-width:140px}
.col-h-name{display:flex!important;align-items:center;gap:10px}
.col-h .oplogo{height:28px;background:#fff;padding:2px;border-radius:5px}
.op{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-ink)}
.plan-name{font-family:var(--f-display);font-size:23px;font-weight:600;line-height:1.15;margin:2px 0 4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--sand);color:var(--ink);font-weight:600}
.tag.ap{background:var(--navy);color:var(--paper)}
.tag.hit{background:var(--ok-bg);color:var(--ok)}
.tag.miss{background:var(--warn-bg);color:var(--warn)}
.price{text-align:right}
.price .v{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--navy);line-height:1}
.price .u{font-size:12px;color:var(--muted)}
.grp{font-size:12px;color:var(--muted)}
.break{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.break b{color:var(--ink);font-weight:600}
details.more{grid-column:2 / -1;margin-top:4px}
details.more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--navy-3);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";color:var(--gold)}
details.more[open] summary::before{content:"– "}
.hosp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 16px;margin-top:8px;font-size:13px}
.hosp-grid div{padding:3px 0;border-bottom:1px dotted var(--line)}
.hosp-grid i{font-style:normal;color:var(--muted);font-size:12px}
.hosp-grid .is-hit{color:var(--ok);font-weight:700}
.city{grid-column:1/-1;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-ink);padding-top:8px;border:0!important}
.info{font-size:13px;color:var(--muted);margin:8px 0 0}
.info b{color:var(--ink)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(290px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{min-width:0;display:flex;flex-direction:column;gap:10px}
.col-h{position:sticky;top:0;z-index:2;background:var(--navy);color:var(--paper);border-radius:10px;padding:10px 14px;border-bottom:2px solid var(--gold)}
.col-h span{display:block;font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.1}
.col-h small{color:var(--gold-2);font-size:12px}
.col .plan{grid-template-columns:auto minmax(0,1fr);padding:14px}
.col .price{grid-column:2;text-align:left;margin-top:2px}
.col .price .v{font-size:26px}
.col .plan-name{font-size:20px}
.col .hosp-grid{grid-template-columns:1fr}
.covwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:center}
.maps{min-height:120px}
.maps figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.maps svg{width:100%;height:auto;display:block;background:var(--sand);border-radius:10px;padding:8px}
.maps .mun{fill:#E7E0CF;stroke:#fff;stroke-width:.8}
.maps .mun-on{fill:var(--gold);stroke:#fff;stroke-width:.8}
.maps path:hover{fill:var(--navy-3)}
.legend .k.off{background:#E7E0CF}
.cities{font-size:12px}
.maps figcaption{font-size:11px;color:var(--muted);text-align:center}
.maps .es-in{fill:var(--gold-2);stroke:#fff}
.maps .es-out{fill:#EFEADF;stroke:#fff}
.maps .pin circle{fill:var(--navy);stroke:#fff;stroke-width:.25}
.maps .uf{fill:#E7E0CF;stroke:#fff;stroke-width:1.2}
.maps .uf-full{fill:var(--gold);stroke:#fff;stroke-width:1.2}
.maps .uf-urg{fill:#B9C3D6;stroke:#fff;stroke-width:1.2}
.maps .uf-faint{fill:#EFEADF;stroke:#fff}
.maps .uf-ring{fill:none;stroke:var(--navy);stroke-width:3}
.legend{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend .k{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .k.full{background:var(--gold)}
.legend .k.urg{background:#B9C3D6}
.legend .k.pinkey{background:var(--navy);border-radius:50%}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}

/* Bottom action bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:var(--paper);border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.bar .wrap{padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar-txt{font-size:14px}
.bar-txt b{color:var(--gold-2)}
.bar-act{display:flex;gap:8px;flex-wrap:wrap}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,31,58,.55);display:grid;place-items:center;padding:16px;z-index:40}
.sheet{background:var(--card);border-radius:14px;max-width:560px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.sheet h3{font-size:24px}
.sheet textarea{min-height:140px;resize:vertical}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;z-index:50;font-size:14px}

/* Client proposal */
.prop-mast{background:var(--navy);color:var(--paper)}
.prop-mast .wrap{padding-block:34px 30px}
.prop-mast .eyebrow{color:var(--gold-2);font-size:16px;letter-spacing:.16em}
.prop-mast h1{font-size:clamp(34px,6vw,52px);color:var(--paper);line-height:1.05;margin-top:6px}
.prop-meta{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:18px;font-size:14px;color:#D7DCE6}
.prop-meta b{display:block;color:var(--paper);font-size:16px}
.gold-rule{height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-2),var(--gold))}
.prop-body{padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pcard-top{padding:18px 20px 16px;border-bottom:1px solid var(--line)}
.pcard-top .plan-name{font-size:26px}
.pcard-price{background:var(--sand);padding:14px 20px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pcard-price .v{font-family:var(--f-display);font-size:36px;font-weight:700;color:var(--navy);line-height:1}
.pcard-sec{padding:14px 20px;border-top:1px solid var(--line)}
.pcard-sec h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
table.bk{width:100%;border-collapse:collapse;font-size:14px}
table.bk td{padding:4px 0;border-bottom:1px dotted var(--line)}
table.bk td:last-child{text-align:right;font-weight:600}
ul.hl{list-style:none;margin:0;padding:0;font-size:14px}
ul.hl li{padding:4px 0;border-bottom:1px dotted var(--line);display:flex;justify-content:space-between;gap:10px}
ul.hl li span:last-child{color:var(--muted);font-size:12px;text-align:right}
.promo{margin:0;padding:14px 20px 16px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:var(--paper);border-top:2px solid var(--gold)}
.promo-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:10px}
.promo-h b{font-family:var(--f-display);font-size:21px;font-weight:700;color:var(--paper)}
.promo-h small{flex-basis:100%;color:var(--gold-2);font-size:12px;letter-spacing:.04em}
.promo-tag{background:var(--gold);color:#fff;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:5px;padding:3px 7px}
.promo-t{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}
.promo-t td{padding:5px 0;border-bottom:1px dotted rgba(217,191,133,.35)}
.promo-t td:last-child{text-align:right;font-weight:700}
.promo-t tr.off td:last-child{color:var(--gold-2);font-size:16px}
.promo-t s{color:#9AA6BD;font-weight:500;font-size:12px;margin-right:4px}
.promo-t .pct{background:var(--gold-2);color:var(--navy);font-size:11px;font-weight:800;border-radius:4px;padding:1px 5px;margin-left:4px}
.promo-i{list-style:none;margin:6px 0 8px;padding:0;font-size:13px;display:flex;flex-direction:column;gap:5px}
.promo-i li{padding-left:20px;position:relative;line-height:1.35}
.promo-i li::before{content:"✓";position:absolute;left:0;color:var(--gold-2);font-weight:800}
.promo-r{margin:0;font-size:11px;color:#B9C3D6;line-height:1.45}
.tag.promo-tag2{background:var(--gold);color:#fff}
.badge.promo-b{background:var(--gold);color:#fff;margin-left:6px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);background:var(--ok-bg);border-radius:6px;padding:2px 7px;margin-bottom:8px}
.contact{background:var(--navy);color:var(--paper);border-radius:16px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.contact h3{font-size:26px;color:var(--paper)}
.contact p{margin:4px 0 0;color:#D7DCE6;font-size:14px}
.contact .phone{font-family:var(--f-display);font-size:28px;color:var(--gold-2);font-weight:700;user-select:all}
.fine{font-size:12px;color:var(--muted);line-height:1.6}
.fine p{margin:0 0 6px}
.back{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30}

@media (max-width:900px){
  .bench{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;overflow:visible}
}
@media (max-width:560px){
  .plan{grid-template-columns:auto minmax(0,1fr)}
  .price{grid-column:2;text-align:left}
  .res-head h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function faixaIdx(age,f){

function buildHash(st){
  const d=new Date(),ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  const t=["q","m"+(st.mod==="ad"?"a":st.mod==="pf"?"i":"e")];if(st.mod==="ad")t.push("p"+st.perfil);else if(st.mod==="em")t.push("c"+st.contr);
  if(beneNow().fx)t.push("e"+st.fx.join("x"));else st.ages.forEach(a=>t.push("i"+a));

  if(st.cliente.trim())t.push("n"+enc(st.cliente.trim()));

function parseHash(h){

    else if(c==="i")q.ages.push(parseInt(v,10));
    else if(c==="e"){const f=v.split("x").map(n=>Math.max(0,Math.min(999,parseInt(n,10)||0)));if(f.length===3)q.fx=f}
    else if(c==="s")q.sel=(v.match(/../g)||[]).map(x=>parseInt(x,36)).filter(i=>PLANS[i]);
    else if(c==="n")q.cliente=dec(v);
    else if(c==="h")q.hosp=dec(v);
    else if(c==="d"){q.data=v.slice(6,8)+"/"+v.slice(4,6)+"/"+v.slice(0,4);q.dia=v}
    else if(c==="b")q.corretor=dec(v);
    else if(c==="k")q.corretora=dec(v);
    else if(c==="w")q.fone=v;
    else if(c==="p")q.perfil=v;
    else if(c==="c")q.contr=v;
  }
  q.ages=q.ages.filter(a=>Number.isFinite(a)&&a>=0&&a<=120);
  q.B=q.fx?{fx:q.fx}:{ages:q.ages};
  return q;
}

function groupsNow(){return st.mod==="ad"?(PERFIS.find(p=>p.k===st.perfil)||PERFIS[0]).g:st.mod==="pf"?PFG:EMP[st.contr]}
function candidates(){
  const gs=groupsNow();
  let list=PLANS.filter(p=>gs.includes(p.grp)&&st.ops[p.op]);
  if(st.blzCp!=="all")list=list.filter(p=>!p.cpt||p.cpt===st.blzCp);
  if(st.ac!=="all")list=list.filter(p=>p.ac===st.ac);
  if(st.hosp)list=list.filter(p=>hasHosp(p,st.hosp));
  const B=beneNow();
  if(B.fx)list=list.filter(fx3ok);else list=list.filter(p=>B.ages.every(a=>faixaIdx(a,p.f)>=0));
  const rows=list.map(p=>({p,q:quote(p,B)}));
  if(st.sort==="preco")rows.sort((a,b)=>a.q.total-b.q.total);
  else rows.sort((a,b)=>a.p.op.localeCompare(b.p.op)||a.q.total-b.q.total);
  return rows;
}

      return out})()}</div>
    <div class="sort"><label for="f-sort">Ordenar</label><select class="field" id="f-sort" style="width:auto;padding:6px 8px"><option value="preco" ${st.sort==="preco"?"selected":""}>Menor preço</option><option value="op" ${st.sort==="op"?"selected":""}>Operadora</option></select></div></div>`;
  if(!rows.length)return head+`<div class="empty">Nenhum plano com esses filtros. Tente outra acomodação ou retire o filtro de hospital.</div>`;
  const card=({p,q})=>{
    const sel=st.sel.includes(p.i);

    const total=rede(p).length;
    return `<article class="plan ${sel?"sel":""}">

        <div class="grp">${esc(G[p.grp].label)}</div>
        <div class="break num">${q.lines.map(l=>`<span>${l.label}${l.n>1?" × "+l.n:""} <b>${brl(l.v)}</b></span>`).join("")}</div>
      </div>
      <div class="price"><div class="v num">${brl(q.total)}</div><div class="u">por mês</div></div>
      <details class="more"><summary>Rede hospitalar (${total}) e condições</summary>
        <div class="hosp-grid">${redeByCity(p).map(([c,hs])=>`<div class="city">${esc(c)}</div>`+hs.map(h=>`<div class="${h.id===st.hosp?"is-hit":""}">${esc(h.nome)}${h.obs?` <i>· ${esc(h.obs)}</i>`:""}</div>`).join("")).join("")}</div>
        ${p.nota?`<p class="info">${esc(p.nota)}</p>`:""}
        <p class="info"><b>Coparticipação:</b> ${esc(p.cp)}</p>
        <p class="info"><b>Abrangência:</b> ${esc(p.ab)}</p>
      </details>
    </article>`};
  const byOp=Object.keys(OPS).map(k=>[k,rows.filter(r=>r.p.op===k)]).filter(([,r])=>r.length);
  if(byOp.length>1){
    return head+`<div class="cols">${byOp.map(([k,r])=>`<div class="col"><div class="col-h"><span class="col-h-name">${logoImg(k)}${esc(OPS[k].nome)}</span><small>${OPS[k].canal?esc(OPS[k].canal)+" · ":""}${r.length} opç${r.length===1?"ão":"ões"} · a partir de ${brl(Math.min(...r.map(x=>x.q.total)))}</small></div><div class="list">${r.slice().sort((a,b)=>a.q.total-b.q.total).map(card).join("")}</div></div>`).join("")}</div>`;
  }
  return head+`<div class="list">${rows.map(card).join("")}</div>`;
}

function copy(text,ok,title){
  const show=()=>openModal(title,`<p class="hint">Não foi possível copiar automaticamente. Selecione o texto abaixo e copie.</p><textarea class="field" id="m-txt" readonly>${esc(text)}</textarea>`,()=>{const t=$("#m-txt");t.focus();t.select()});
  const done=()=>{if(/^https?:\/\//.test(text)){openModal(title,`<p class="hint">Link copiado. É este link abaixo que vai para o cliente.</p><textarea class="field" id="m-txt" readonly style="min-height:110px">${esc(text)}</textarea>`,()=>{const t=$("#m-txt");t.focus();t.select()})}else toast(ok)};
  try{navigator.clipboard.writeText(text).then(done,show)}catch(e){show()}
}
function openModal(title,body,after,actions){
  const m=document.createElement("div");m.className="modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");
  m.innerHTML=`<div class="sheet"><h3>${esc(title)}</h3>${body}<div class="row">${actions||""}<button class="btn" type="button" data-close>Fechar</button></div></div>`;
  m.addEventListener("click",e=>{if(e.target===m||e.target.hasAttribute("data-close"))m.remove()});
  document.body.appendChild(m);after&&after(m);
}

let HIST=[],histReady=false,histCol=null,histInit=false;
function loadLocal(){try{HIST=JSON.parse(localStorage.getItem("cot-hist")||"[]")}catch(e){HIST=[]}HIST.sort((a,b)=>b.criada.localeCompare(a.criada))}
function saveLocal(){try{localStorage.setItem("cot-hist",JSON.stringify(HIST.slice(0,500)))}catch(e){}}
function onHist(){histReady=true;const c=document.querySelector(".tabs .cnt");if(c)c.textContent=HIST.length;else{const t=document.querySelector('[data-go="hist"]');if(t&&!t.querySelector(".cnt"))t.insertAdjacentHTML("beforeend",` <span class="cnt num">${HIST.length}</span>`)}if(location.hash==="#cotacoes")renderHist()}

/* ===== Link curto (#p + 8 letras): o celular descarta links longos depois do # ===== */
let SHARED_DB=null;
async function sharedDB(){if(SHARED_DB)return SHARED_DB;try{if(window.__R)SHARED_DB=await window.__R.use("db")}catch(e){}return SHARED_DB}
const genCode=()=>{const a="abcdefghijkmnpqrstuvwxyz23456789";let c="";const r=crypto.getRandomValues(new Uint8Array(8));r.forEach(x=>c+=a[x%a.length]);return c};
const shortOf=code=>(SHARE_BASE||location.href.split("#")[0])+"#p"+code;
function pubShort(code,hash){sharedDB().then(db=>{if(db){const o={h:hash,criada:new Date().toISOString()};if(FOTO_CORRETOR!==AVATAR_PADRAO)o.f=FOTO_CORRETOR;db.doc("propostas/"+code).set(o).catch(()=>{})}})}
function ensureShort(rec){
  if(rec.code)return shortOf(rec.code);
  if(!SHARED_DB)return rec.link;
  rec.code=genCode();pubShort(rec.code,rec.hash);
  const sl=shortOf(rec.code);if(rec.zap)rec.zap=rec.zap.split(rec.link).join(sl);
  if(histCol)histCol.doc(rec.id).set(rec).catch(()=>{});
  return sl;
}
async function initHist(){
  if(histInit)return;histInit=true;
  loadLocal();
  const timer=setTimeout(()=>{if(!histReady)onHist()},10000);
  try{
    const cl=window.__C;if(!cl||!cl.use)throw 0;
    const [db,user]=await Promise.all([cl.use("db"),cl.use("user")]);
    const uid=db&&user?await user.id():null;if(!uid)throw 0;
    histCol=db.collection("data/users/"+uid);
    histCol.orderBy("criada","desc").limit(500).onSnapshot(snap=>{
      clearTimeout(timer);
      const remote=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      const ids=new Set(remote.map(r=>r.id));
      const pend=HIST.filter(h=>!ids.has(h.id)&&h.local);
      HIST=remote.concat(pend).sort((a,b)=>b.criada.localeCompare(a.criada));
      onHist();
    },()=>{histCol=null;clearTimeout(timer);onHist()});
  }catch(e){clearTimeout(timer);onHist()}
}
async function saveQuote(rec){
  HIST=[rec].concat(HIST.filter(h=>h.id!==rec.id));
  if(histCol){try{await histCol.doc(rec.id).set(rec);return true}catch(e){}}
  rec.local=true;saveLocal();onHist();return false;
}
async function delQuote(id){
  HIST=HIST.filter(h=>h.id!==id);
  if(histCol){try{await histCol.doc(id).delete()}catch(e){}}
  saveLocal();onHist();
}
const fmtData=iso=>{const d=new Date(iso);return d.toLocaleDateString("pt-BR")+" · "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};

function syncInputs(){

  const c=$("#f-cli");if(c)st.cliente=c.value;
}
function gerarCotacao(mode){
  syncInputs();
  if(!st.sel.length||!beneCount(beneNow())){update();toast("Informe os beneficiários e marque ao menos um plano.");return}
  const B=beneNow();
  const plans=st.sel.map(i=>PLANS[i]).map(p=>({p,q:quote(p,B)})).sort((a,b)=>a.q.total-b.q.total);
  const upd=mode==="update"&&st.editId;
  const snap=JSON.parse(JSON.stringify(st));delete snap.editId;delete snap.editCriada;delete snap.editNome;
  const rec={id:upd?st.editId:Date.now().toString(36)+Math.random().toString(36).slice(2,6),criada:upd?st.editCriada:new Date().toISOString(),
    cliente:st.cliente.trim(),modal:modTxt(st),
    bene:beneText(B),hash:buildHash(st),link:linkFor(),zap:zapText(),code:undefined,
    planos:plans.map(({p,q})=>({op:p.op,i:p.i,nome:pname(p),ac:acLbl(p.ac),total:Math.round(q.total*100)/100})),
    st:snap};
  if(upd)rec.editada=new Date().toISOString();
  if(rec.code){pubShort(rec.code,rec.hash);rec.zap=rec.zap.split(rec.link).join(shortOf(rec.code))}else delete rec.code;
  saveQuote(rec).then(ok=>{if(!ok&&!histCol)toast("Cotação salva neste navegador.")});
  if(st.editId){delete st.editId;delete st.editCriada;delete st.editNome;saveDraft();renderBroker()}
  openResumo(rec,upd?"edit":true);
}

        <div class="pcard-sec"><h4>Hospitais na Grande Vitória</h4>
          ${!cities.length?`<p class="info">Rede própria e credenciada da operadora; consulte a lista no guia médico.</p>`:gv.length?`<ul class="hl">${gv.flatMap(([,hs])=>hs).map(li).join("")}</ul>`:`<p class="info">Sem hospitais na Grande Vitória nesta rede.</p>`}
          ${innerCount?`<details class="more" style="margin-top:8px"><summary>Ver mais ${innerCount} no interior</summary><ul class="hl">${inner.flatMap(([,hs])=>hs).map(li).join("")}</ul></details>`:""}
          ${p.nota?`<p class="info">${esc(p.nota)}</p>`:""}
        </div>

          <p class="info" style="margin-top:0"><b>Coparticipação:</b> ${esc(p.cp)}</p>

          <p class="info"><b>Carências:</b> ${esc(CAR[OPS[p.op].oper]||CAR[p.op]||"Carências contratuais conforme a operadora.")}</p>
          <p class="info"><b>Tabela:</b> ${esc(G[p.grp].label)}</p>
        </div>
      </article>`}).join("")}</div>
    ${(q.corretor||fone)?`<section class="contact">
      <div><div class="eyebrow" style="color:var(--gold-2)">Seu corretor</div><h3>${esc(q.corretor||q.corretora)}</h3><p>Fale comigo para tirar dúvidas e seguir com a contratação.</p></div>
      <div style="text-align:right">${fone?`<div class="phone num">${esc(fone)}</div>`:""}${wa?`<a class="btn gold" href="${wa}" target="_blank" rel="noopener" style="margin-top:8px">Conversar no WhatsApp</a>`:""}</div>
    </section>`:""}
    <section class="fine">
      <p>Valores mensais calculados pelas tabelas vigentes das operadoras (${ops.map(o=>esc(OPS[o].nome)+": "+esc(OPS[o].versao)).join("; ")}). A mensalidade muda conforme a faixa etária e o reajuste anual.</p>
      <p>Mapa: malha municipal do IBGE.</p>
      <p>A contratação depende da comprovação de vínculo com a entidade ou empresa, da declaração de saúde e da análise da operadora. Rede hospitalar sujeita a alteração pela operadora.</p>
    </section>
  </main>
  <div class="back"><button class="btn gold pdf-bt" type="button" id="bt-pdf">Gerar PDF</button>${preview?`<button class="btn navy" type="button" id="bt-back">Voltar ao cotador</button>`:""}</div>`;
  drawMaps();
  const bp=$("#bt-pdf");if(bp)bp.onclick=()=>baixarPDF(q);
  if(preview){let auto=false;try{auto=sessionStorage.getItem("cot-autopdf")==="1";sessionStorage.removeItem("cot-autopdf")}catch(e){}if(auto)setTimeout(()=>baixarPDF(q),400)}
  const bb=$("#bt-back");if(bb)bb.onclick=()=>{try{sessionStorage.removeItem("cot-preview")}catch(e){}history.pushState("",document.title,location.pathname+location.search);route()};
}


/* ===== PDF da proposta (para clientes que não abrem o link) ===== */
function loadLib(src,ready){if(ready())return Promise.resolve();return new Promise((ok,er)=>{const s=document.createElement("script");s.src=src;s.onload=()=>ok();s.onerror=()=>er({code:"lib"});document.head.appendChild(s)})}
let PDF_BUSY=false;
async function baixarPDF(q){
  if(PDF_BUSY)return;PDF_BUSY=true;
  const bar=document.querySelector(".back");if(bar)bar.hidden=true;
  toast("Gerando o PDF da proposta…");
  try{
    await loadLib("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",()=>!!window.html2canvas);
    await loadLib("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",()=>!!(window.jspdf&&window.jspdf.jsPDF));
    document.querySelectorAll("#app details").forEach(d=>d.open=true);
    window.scrollTo(0,0);
    const w=app.scrollWidth,h=app.scrollHeight;
    const cv=await window.html2canvas(app,{scale:2,backgroundColor:"#F8F5EE",useCORS:true,logging:false,width:w,height:h,windowWidth:document.documentElement.clientWidth});
    const pdf=new window.jspdf.jsPDF({unit:"px",format:[w,h],orientation:h>w?"p":"l",hotfixes:["px_scaling"],compress:true});
    pdf.addImage(cv.toDataURL("image/jpeg",0.86),"JPEG",0,0,w,h);
    const blob=pdf.output("blob");
    const name=("Proposta-"+(q.cliente||"Plano-de-Saude")+"-"+(q.corretora||cfg.corretora||"Proposta")).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9-]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"")+".pdf";
    const dl=window.__R?await window.__R.use("downloads"):null;
    if(!dl){toast("O download não está disponível nesta tela.");return}
    let data=blob;
    /* dentro da Central a tela roda num quadro: o arquivo é montado na página principal para o download ser aceito */
    try{if(window.parent!==window&&parent.Blob){const buf=await blob.arrayBuffer();data=new parent.Blob([new parent.Uint8Array(buf)],{type:"application/pdf"})}}catch(e){data=blob}
    await dl.save({filename:name,data});
    toast("PDF salvo. Envie ao cliente pelo WhatsApp.");
  }catch(e){
    const c=e&&e.code;
    if(c==="declined")toast("Download cancelado.");
    else if(c==="rate_limited")toast("Já existe um download aberto. Conclua ou feche e tente de novo.");
    else if(c==="lib")toast("Não consegui carregar o gerador de PDF. Verifique a internet e tente de novo.");
    else toast("Não foi possível gerar o PDF agora"+(c?" (código: "+c+")":"")+". Tente de novo.");
  }finally{if(bar)bar.hidden=false;PDF_BUSY=false}
}

/* ===== Proteção: quem não é o corretor não vê o cotador ===== */
function renderGuard(){
  const fone=cfg.fone||"",zap=fone.replace(/\D/g,"");
  app.innerHTML=`<header class="prop-mast"><div class="wrap prop-mast-in"><div class="prop-mast-txt">
    <div class="eyebrow">${esc(cfg.corretora||"Proposta de plano de saúde")}</div><h1>Sua proposta</h1>
    <p style="color:#D7DCE6;max-width:52ch;margin:14px 0 0;font-size:15px">Não foi possível carregar a sua proposta por este link. Isso costuma acontecer quando ele é aberto pelo celular. Peça ao seu corretor o PDF da proposta, que abre em qualquer aparelho.</p></div>
    ${cfg.corretor?`<div class="prop-side"><figure class="prop-foto"><img src="${FOTO_CORRETOR}" alt="Foto de ${esc(cfg.corretor)}"><figcaption><b>${esc(cfg.corretor)}</b><span>Seu corretor</span>${fone?`<em class="num">${esc(fone)}</em>`:""}</figcaption></figure></div>`:""}
  </div></header><div class="gold-rule"></div>
  <main class="wrap prop-body">${cfg.corretor?`<section class="contact"><div><div class="eyebrow" style="color:var(--gold-2)">Fale comigo</div><h3>${esc(cfg.corretor)}</h3><p>Envio sua proposta em PDF na hora.</p></div>
  ${zap?`<div style="text-align:right"><div class="phone num">${esc(fone)}</div><a class="btn gold" href="https://wa.me/55${zap}" target="_blank" rel="noopener" style="margin-top:8px">Conversar no WhatsApp</a></div>`:""}</section>`:""}
  <p class="fine" style="text-align:center"><button type="button" id="bt-corretor" style="border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px">Sou o corretor</button></p></main>`;
  $("#bt-corretor").onclick=()=>{try{sessionStorage.setItem("cot-corretor","1")}catch(e){}route()};
}
let GUARD_OK=null;
async function checkGuard(){
  try{if(sessionStorage.getItem("cot-corretor")==="1")return}catch(e){}
  if(window.parent!==window||!window.__R)return;
  if(GUARD_OK===null){const u=await window.__R.use("user");GUARD_OK=!!(u&&((await u.isOwner())||(await u.canEdit())))}
  if(!GUARD_OK&&!parseHash(location.hash))renderGuard();
}
async function openShort(code){
  app.innerHTML=`<main class="wrap prop-body"><div class="empty">Carregando sua proposta…</div></main>`;
  let h=null;
  try{const db=await sharedDB();if(db){const sn=await db.doc("propostas/"+code).get();if(sn.exists){h=sn.data().h;window.__FOTO_PROP=sn.data().f||null}}}catch(e){}
  const q=h?parseHash("#"+h):null;
  if(q&&beneCount(q.B))renderClient(q);else renderGuard();
}
function route(){
  const m=/^#p([a-z0-9]{8})$/.exec(location.hash);
  if(m){openShort(m[1]);window.scrollTo(0,0);return}
  const q=parseHash(location.hash);
  if(q&&beneCount(q.B)){renderClient(q)}
  else{initHist();if(location.hash==="#cotacoes")renderHist();else renderBroker();checkGuard()}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
sharedDB();
route();
loadPerfil();
</script>
