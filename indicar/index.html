<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Indique alguém</title>
<meta name="description" content="Indique quem precisa de plano de saúde.">
<meta property="og:type" content="website">
<meta property="og:title" content="Indique alguém">
<meta property="og:description" content="Indique quem precisa de plano de saúde.">
<meta property="og:locale" content="pt_BR">
<meta name="theme-color" content="#0e2a52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0e2a52;--navy2:#16386b;--gold:#b08a3e;--gold-soft:#f4ecdc;--ink:#1c2533;--muted:#5b6678;--line:#e3e6ec;--bg:#f7f6f2;--card:#fff;--ok:#1f7a4d}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px}
  header.top{background:var(--navy);color:#fff;padding:26px 0 24px}
  .quem{display:flex;align-items:center;gap:14px}
  .foto{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid var(--gold);background:var(--navy2);display:grid;place-items:center;overflow:hidden;font-family:Fraunces,Georgia,serif;font-size:22px;color:#fff}
  .foto img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
  .quem b{display:block;font-size:17px} .quem span{font-size:13px;color:#d9c391}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:26px;line-height:1.2;margin:18px 0 6px}
  header p{margin:0;color:#d6deea;font-size:15px}
  main{padding:20px 0 30px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
  .card h2{font-size:16px;margin:0 0 6px;color:var(--navy)}
  .card p{margin:0 0 10px;color:var(--muted);font-size:15px}
  .notas{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin:8px 0 4px}
  .notas button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 0;font:600 15px Inter,sans-serif;color:var(--ink);cursor:pointer}
  .notas button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .esc{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  label{display:block;font-size:14px;font-weight:500;margin:10px 0 4px}
  input,textarea{width:100%;font:16px Inter,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:80px;resize:vertical}
  .btn{display:inline-block;width:100%;margin-top:14px;background:var(--gold);color:#fff;border:0;border-radius:10px;padding:13px 18px;font:600 16px Inter,sans-serif;cursor:pointer}
  .btn[disabled]{opacity:.6}
  .msg{font-size:14px;margin-top:8px;color:#a33}
  .feito{background:#eef7f1;border-color:#cfe8d8}
  .feito h2{color:var(--ok)}
  .lgpd{font-size:12px;color:var(--muted);margin-top:10px}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:0 0 30px}
  @media(max-width:380px){.notas{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="quem"><div class="foto" id="foto">✓</div><div><b id="cNome">Seu consultor</b><span id="cCorr">Consultor de planos de saúde</span></div></div>
  <h1>Indique quem você gosta</h1>
  <p>Plano de saúde com atendimento de perto, do começo ao pós-venda.</p>
</div></header>
<main class="wrap">
<div class="card" data-form id="iBox"></div>
</main>
<footer class="wrap">Seus dados vão apenas para o seu consultor. Não compartilhamos com terceiros.</footer>
<script>
  var SB_URL="https://tqhrjivlfpexmhkwakwl.supabase.co", SB_KEY="sb_publishable_vI455mCunOwgHkEaPra01w_05Ynugib";
  var m=/^#?([a-z0-9]{8})(?:-([a-z0-9]{4,12}))?/.exec((location.hash||"").toLowerCase())||[], COD=m[1]||"", TK=m[2]||"";
  function $(i){return document.getElementById(i)}
  function rpc(fn,body){ return fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.ok?r.json():null}); }
  function cartao(){
    if(!COD){ semCodigo(); return; }
    rpc("ler_proposta",{codigo:COD}).then(function(d){
      if(!d||!d.bv){ semCodigo(); return; }
      var nome=String(d.n||"").trim(); if(nome){ $("cNome").textContent=nome; window.CNOME=nome.split(/\s+/)[0]; }
      if(d.c) $("cCorr").textContent=String(d.c);
      var f=$("foto"); f.textContent="";
      if(d.f&&/^data:image\/(jpeg|png|webp);base64,/.test(d.f)){ var im=new Image(); im.alt="Foto de "+(nome||"seu consultor"); im.src=d.f; f.appendChild(im); }
      else f.textContent=(nome.split(/\s+/).map(function(x){return x.charAt(0)}).join("").slice(0,2)||"✓").toUpperCase();
      document.querySelectorAll("[data-cn]").forEach(function(e){ e.textContent=window.CNOME||"seu consultor"; });
    }).catch(function(){});
  }
  function semCodigo(){ var b=document.querySelector("[data-form]"); if(b) b.innerHTML='<h2>Link incompleto</h2><p>Peça o link de novo ao seu consultor.</p>'; }
  function enviar(tipo,dados,btn,msg,ok){
    if(!COD){ semCodigo(); return; }
    btn.disabled=true; msg.textContent="";
    dados.tk=TK;
    rpc("enviar_publico",{codigo:COD,tipo:tipo,dados:dados}).then(function(r){
      btn.disabled=false;
      if(r&&r.ok){ ok(); return; }
      var e=r&&r.erro; msg.textContent=e==="dados"?"Confira os dados: nome e WhatsApp com DDD.":e==="limite"?"Muitos envios agora. Tente de novo mais tarde.":"Não consegui enviar. Tente de novo.";
    },function(){ btn.disabled=false; msg.textContent="Sem conexão. Tente de novo."; });
  }
  function formInd(box,onDone){
    box.innerHTML='<h2>Indique alguém</h2><p>Conhece quem precisa de plano de saúde? <span data-cn>Seu consultor</span> faz uma cotação sem compromisso.</p>'+
      '<label for="iNome">Nome de quem você indica</label><input id="iNome" autocomplete="off" maxlength="80">'+
      '<label for="iTel">WhatsApp com DDD</label><input id="iTel" inputmode="tel" placeholder="(27) 99999-9999" maxlength="20">'+
      '<label for="iObs">Observação (opcional)</label><input id="iObs" placeholder="ex.: esposa, 2 vidas, tem CNPJ" maxlength="200">'+
      '<label for="iQuem">Seu nome (opcional)</label><input id="iQuem" autocomplete="name" maxlength="60">'+
      '<button class="btn" type="button" id="iBtn">Enviar indicação</button><div class="msg" id="iMsg" role="status"></div>'+
      '<p class="lgpd">Envie só os dados de quem concordou em receber o contato.</p>';
    if(window.CNOME) box.querySelectorAll("[data-cn]").forEach(function(e){e.textContent=window.CNOME});
    $("iBtn").onclick=function(){
      var d={nome:$("iNome").value.trim(),telefone:$("iTel").value,obs:$("iObs").value.trim(),quem:$("iQuem").value.trim()};
      if(!d.nome||d.telefone.replace(/\D/g,"").length<10){ $("iMsg").textContent="Escreva o nome e o WhatsApp com DDD."; return; }
      enviar("indicacao",d,$("iBtn"),$("iMsg"),function(){
        box.classList.add("feito");
        box.innerHTML='<h2>Indicação enviada! 🙌</h2><p>Obrigado! <span data-cn>Seu consultor</span> vai entrar em contato com '+d.nome.replace(/[<>&]/g,"")+' em breve.</p><button class="btn" type="button" id="iMais">Indicar mais alguém</button>';
        if(window.CNOME) box.querySelectorAll("[data-cn]").forEach(function(e){e.textContent=window.CNOME});
        $("iMais").onclick=function(){ box.classList.remove("feito"); formInd(box,onDone); };
        if(onDone) onDone();
      });
    };
  }
  formInd($("iBox"));
  cartao();
</script>
</body>
</html>
